# This is a basic workflow to help you get started with Actions

# this workflow is used to check image
name: Checker

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the code branch
  push:
    branches: [ code ]
  pull_request:
    branches: [ code ]
  workflow_dispatch:


jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: code
          # check_pub_img.sh 只处理 markdown，不需要主题。
          # 而且 submodules: true 会连私有的 infra/ 一起拉，runner 拉不到。
          submodules: false
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
    # use check_pub_img.sh to check image
      - name: Check image
        run: bash check_pub_img.sh