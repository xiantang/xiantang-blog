# Builds the production (nginx + prebuilt Hugo site) image from Dockerfile.k8s
# and pushes it to GHCR for the k3s/k8s deployment to pull.
# When the AWS_ROLE_ARN / AWS_REGION / ECR_REPOSITORY repository variables are
# set, the same image is also pushed to AWS ECR in one multi-registry build.
name: Build image

on:
  push:
    branches: [ code ]
    paths-ignore:
      # 这些路径的内容进不了镜像，改了不该重新构建。
      # 也顺带保证最后那步自动回填 appVersion 的 bot commit 不会循环触发构建
      # （它只动 k8s/charts/**）。
      - 'k8s/charts/**'
      - 'k8s/argocd/**'
      - 'k8s/scripts/**'
      - 'k8s/README.md'
      # 只匹配仓库根目录的 md（README/AGENTS），不会匹配 content/ 下的博客文章
      - '*.md'
      #
      # 注意别把整个 k8s/** 加进来：Dockerfile.k8s 里有 COPY k8s/nginx.conf，
      # 改 nginx 配置是必须重新构建镜像的。
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      # write 是为了最后那步把 appVersion 回填进 Chart.yaml 并 push
      contents: write
      packages: write
      id-token: write   # required for AWS OIDC federation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 不能用 submodules: true —— 它会连 infra/ 一起拉，而那是个【私有】
          # 仓库且配的是 SSH URL，runner 既没有 SSH key，GITHUB_TOKEN 也读不到
          # 别的私有仓库。构建镜像只需要 Hugo 主题，下一步单独初始化。
          submodules: false
          fetch-depth: 0

      - name: Fetch Hugo themes
        run: git submodule update --init --depth 1 themes/ananke themes/even

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: vars.AWS_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compose image list
        id: images
        run: |
          {
            echo 'list<<EOF'
            echo "${REGISTRY}/${IMAGE_NAME}"
            if [ -n "${ECR_REGISTRY}" ]; then
              echo "${ECR_REGISTRY}/${ECR_REPOSITORY}"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          # 只推 sha-<commit>，不推 latest。
          # 集群拉的是 Chart.yaml 里的 appVersion（一个 sha- tag），latest 没有
          # 任何消费者；而它每次被覆盖都会在 ECR 里留下一个 untagged 孤儿镜像，
          # 更重要的是它挡着 ECR 的 IMMUTABLE ——「同一个 tag 不许覆盖」和
          # 「latest 天生要被覆盖」是互斥的。
          tags: |
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.k8s
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像推成功之后，把 Chart.yaml 的 appVersion 指向这次构建出的 tag。
      # ArgoCD 轮询到这个 commit 就会自动滚动更新，整个发布不需要人工介入。
      #
      # 不会循环触发构建，有两层保护：
      #   1. k8s/charts/** 在上面的 paths-ignore 里
      #   2. 用 GITHUB_TOKEN 推的 commit，GitHub 本身就不会再触发 workflow
      #
      # ⚠️ 副作用：仓库里会多出机器人 commit，本地下次 push 前必须先 git pull，
      #    否则会被拒绝（远端多了你没有的 commit）。
      - name: Bump chart appVersion to this build
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          NEW_TAG="sha-${GITHUB_SHA}"
          CHART=k8s/charts/blog/Chart.yaml

          # 只替换 appVersion 那一行，注释和其他字段不动
          sed -i "s|^appVersion: .*|appVersion: \"${NEW_TAG}\"|" "$CHART"

          if git diff --quiet -- "$CHART"; then
            echo "appVersion 已经是 ${NEW_TAG}，无需提交（多半是重跑了同一个 commit）"
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CHART"
          git commit -m "chore(k8s): release ${NEW_TAG}" \
                     -m "由 build-image.yml 自动回填。镜像已推到 GHCR，ArgoCD 会自动同步。"

          # checkout 出来是 detached HEAD，要显式指定推到哪个分支
          git push origin "HEAD:${GITHUB_REF_NAME}"
