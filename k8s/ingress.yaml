# k3s ships Traefik by default, so ingressClassName: traefik works out of the box.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xiantang-blog
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - k8s.vim0.com
      secretName: xiantang-blog-tls
  rules:
    - host: k8s.vim0.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xiantang-blog
                port:
                  number: 80
