# DNS-01 走 Cloudflare API 校验域名所有权，不需要开放 80 端口给 HTTP-01，
# 也不受 Cloudflare 代理（橙色云）影响，因为 TXT 记录校验走的是 DNS 而不是 HTTP。
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: zhujingdi1998@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
