apiVersion: v2
name: blog
description: xiantang 的 Hugo 博客，nginx 提供静态文件服务

# application = 普通应用；另一种是 library（只提供模板片段供别的 chart 引用，不能单独安装）
type: application

# version 是 chart 自身的版本，改模板/values 结构时递增（必须是 SemVer）
version: 0.1.0

# appVersion 是被打包的应用的版本，和 chart 版本互相独立。
#
# 这里放的是 CI 构建出的镜像 tag（build-image.yml 里 type=sha,format=long
# 生成的 sha-<完整40位commit>）。博客没有语义化版本，用 commit sha 做版本
# 标识既准确又可追溯：拿到这个值就能直接 git show 出线上跑的是哪份代码。
#
# values.yaml 里 image.tag 留空，会回退到这里，所以发布时只改这一处。
#
# 引号是必须的：不加的话纯数字的版本会被 YAML 当成数字解析。
appVersion: "sha-4d91dad0bc39fa38bea65aaa7930eca3a91c9fa6"
