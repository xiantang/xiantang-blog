# 这是唯一「给使用者改」的文件。templates/ 里的东西是实现细节。

replicaCount: 2

image:
  repository: ghcr.io/xiantang/xiantang-blog
  # tag 留空 → 回退到 Chart.yaml 的 appVersion（一个不可变的 sha-<commit> tag）。
  # 发布新版本请改 Chart.yaml，不要在这里写死。
  #
  # 不用 latest：latest 是会漂移的，指向它的话 helm rollback 只会把同一个
  # 移动靶重新拉一遍，回滚是假的；而且多副本之间可能拉到不同的镜像内容。
  tag: ""
  # tag 不可变了，就没必要每次都回源确认，IfNotPresent 更快也更省流量
  pullPolicy: IfNotPresent

# 从 ECR 拉镜像所需的凭据刷新。
#
# ECR 不是公开仓库，而且它的登录 token 只有 12 小时有效期 —— 所以需要一个
# CronJob 定期重建 imagePullSecret（见 templates/ecr-credentials.yaml）。
# GHCR 那边不需要这些，因为镜像是 public 的。
#
# ⚠️ 开启前置条件：节点的 k3s-node Role 必须挂上
#    arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
ecr:
  enabled: true
  region: ap-southeast-1
  registry: 521218410956.dkr.ecr.ap-southeast-1.amazonaws.com
  secretName: ecr-pull-secret
  # 这两个镜像自己是从公网拉的，不受 ECR 凭据影响 —— 否则会变成
  # 「要先有凭据才能拉到刷新凭据的镜像」的死锁。
  # kubectl 的 tag 跟 k3s 的 k8s 版本对齐（k version | grep Server）
  awsCliImage: amazon/aws-cli:2.36.19
  kubectlImage: rancher/kubectl:v1.36.2

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  host: k8s.vim0.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    # 留空则自动生成 <release-name>-tls
    secretName: ""

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

# 探针路径对静态站点来说 / 就够了；抽出来是为了以后换成 /healthz 不用改模板
probePath: /
