{{- if .Values.ecr.enabled -}}
{{- $fullName := include "blog.fullname" . -}}
{{- $saName := printf "%s-ecr-refresher" $fullName -}}
# ECR 的登录 token 只有 12 小时有效期，所以 imagePullSecret 必须定期重建。
# 这个 CronJob 就是干这个的。
#
# 凭据来源是节点的 instance profile（k3s-node Role），Pod 里没有任何密钥。
#
# ⚠️ hostNetwork: true 是必需的，不是为了图方便：
#   Pod 在容器网络里访问 IMDS 要多一跳，而实例的 HttpPutResponseHopLimit
#   默认是 1，IMDSv2 的 PUT 请求会被丢掉，取不到凭据。
#   另一个解法是把 hop limit 调成 2，但那等于允许集群里**所有** Pod 读 IMDS
#   —— 一个有 SSRF 的应用就能偷走节点的 AWS 凭据（Capital One 那次事故的
#   原理）。只给这一个可信的 CronJob 开 hostNetwork 是小得多的口子。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
---
# 权限刚好够：只能管这一个 Secret，不能读别的。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    # 限定到具体名字：这个 SA 拿不到集群里其它 Secret
    resourceNames: [{{ .Values.ecr.secretName | quote }}]
    verbs: ["get", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
roleRef:
  kind: Role
  name: {{ $saName }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $saName }}
  labels:
    {{- include "blog.labels" . | nindent 4 }}
spec:
  # 8 小时刷一次，token 有效期 12 小时 —— 留了 4 小时余量，
  # 一次失败不会立刻导致拉不到镜像。
  schedule: "0 */8 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # 失败重试 3 次就放弃，等下一个 8 小时。避免坏掉的任务无限重启。
      backoffLimit: 3
      template:
        spec:
          serviceAccountName: {{ $saName }}
          restartPolicy: OnFailure
          hostNetwork: true          # ← 见文件头注释，为了 IMDS
          dnsPolicy: ClusterFirstWithHostNet
          volumes:
            - name: shared
              emptyDir: {}
          initContainers:
            # 第一步：用 IMDS 里的实例凭据换 ECR 登录密码，并把完整的 Secret
            # YAML 生成出来。
            #
            # ⚠️ 为什么在这里生成 YAML 而不是让 kubectl 自己 create：
            # rancher/kubectl 是精简镜像，**没有 /bin/sh**，入口点就是 kubectl
            # 二进制。所以第二步里跑不了 shell，也就用不了
            # `kubectl create ... --dry-run | kubectl apply -f -` 这种管道写法。
            # 把带 shell 的活全放在这个容器里，kubectl 那步只剩单条 apply。
            - name: render-secret
              image: {{ .Values.ecr.awsCliImage | quote }}
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  PW=$(aws ecr get-login-password --region {{ .Values.ecr.region }})
                  # docker config 里的 auth 字段是 base64("用户名:密码")，
                  # ECR 的用户名固定是 AWS。-w0 关掉换行，否则 base64 会折行。
                  AUTH=$(printf 'AWS:%s' "$PW" | base64 -w0)
                  CONFIG=$(printf '{"auths":{"%s":{"auth":"%s"}}}' \
                    '{{ .Values.ecr.registry }}' "$AUTH" | base64 -w0)
                  cat > /shared/secret.yaml <<EOF
                  apiVersion: v1
                  kind: Secret
                  metadata:
                    name: {{ .Values.ecr.secretName }}
                    namespace: {{ .Release.Namespace }}
                  type: kubernetes.io/dockerconfigjson
                  data:
                    .dockerconfigjson: $CONFIG
                  EOF
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            # 第二步：apply 上一步生成的文件。
            # 用 apply 而不是 delete+create：后者中间有个窗口期 Secret 不存在，
            # 正好赶上拉镜像就会失败。
            - name: write-secret
              image: {{ .Values.ecr.kubectlImage | quote }}
              # 没有 command —— 镜像的 entrypoint 就是 kubectl，这里只给参数
              args: ["apply", "-f", "/shared/secret.yaml"]
              volumeMounts:
                - name: shared
                  mountPath: /shared
{{- end }}
